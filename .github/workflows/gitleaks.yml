name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  gitleaks:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret for
      # organization repos, so run the pinned binary directly instead.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan only what this PR/push introduces, so pre-existing history cannot
      # block it. The repo's .gitleaks.toml (default rules) is used.
      - name: Scan for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${BASE_REF}" --quiet
            gitleaks git --config .gitleaks.toml \
              --log-opts="origin/${BASE_REF}..HEAD" --redact --verbose
          elif git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null 2>&1; then
            gitleaks git --config .gitleaks.toml \
              --log-opts="${EVENT_BEFORE}..HEAD" --redact --verbose
          else
            # branch just created or force-pushed from a rewritten tip: scan
            # the current tree instead of the unreachable commit range
            gitleaks dir --config .gitleaks.toml . --redact --verbose
          fi
