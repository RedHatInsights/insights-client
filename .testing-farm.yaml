version: 1

# PILOT BRANCH (cct-3160/pilot-vault) — CCT-3155 guest-pull pilot. TEMPORARY:
# delete after the pilot; never merge into main. It differs from
# cct-3160/remove-settings-url only in this file (four encrypted-blob slots,
# placeholders until the owner's encrypt step fills them — see the pilot
# procedure). The pytest-client-tools install stays at @main in
# integration-tests/requirements.txt: the @vault: sentinel loader (PR #70) is
# merged on PCT main, so no pin is needed on this branch.
#
# SETTINGS_URL is delivered as an encrypted Testing Farm secret below, so the
# location of the served configuration is not advertised in plain text. For
# the pilot it is re-pointed at the staged sentinel file
# (settings.vault.toml): non-secret values plus "@vault:<path>:<key>"
# sentinels in the credential slots, resolved on the guest at config-load
# time by the pytest-client-tools loader via AppRole login against
# VAULT_ADDR. Credential values never appear in the served file. Gating
# pipelines pass the same class of URL at request time.
#
# LAYOUT NOTE: the secrets map sits directly under `environments` (the flat
# form TF's repo-config parser reads — gluetool-modules InRepoConfig). A
# nested `environments.default.secrets` map is silently IGNORED by Testing
# Farm (pydantic drops the unknown `default` key; discovered in the first
# rhc pilot run and confirmed in this repo's first pilot run — the guest
# never received SETTINGS_URL). Entries below are scalars; the parser also
# accepts lists of per-token ciphertexts.
#
# To regenerate an entry, authenticate with the team token
# (TESTING_FARM_API_TOKEN environment variable only — the CLI refuses it as
# an option) and encrypt for THIS repository. Capture the output through
# "| jq -r ." — the encrypt API returns a JSON-quoted string, and a quoted
# blob breaks this file — then paste the unquoted "<token-id>,<ciphertext>"
# verbatim as the scalar value:
#
#   testing-farm encrypt <value> --git-url https://github.com/RedHatInsights/insights-client | jq -r .
#
# See: https://docs.testing-farm.io/Testing%20Farm/0.1/test-request.html#secrets-in-repo-config
environments:
  secrets:
    # URL of the staged sentinel settings file (non-secret literal; the
    # exact value lives in the owner's pilot procedure, not in this repo).
    # Regenerate:
    #   testing-farm encrypt <staged-vault-settings-url> \
    #     --git-url https://github.com/RedHatInsights/insights-client | jq -r .
    # Pre-pilot value (sanitized-settings URL; restored on pilot rollback):
    # SETTINGS_URL: "f59f9cfd-119c-40db-a0e5-c4e9ef277da5,"
    SETTINGS_URL: "f59f9cfd-119c-40db-a0e5-c4e9ef277da5,"
    # Address of the Vault server the guest-side loader logs in to
    # (non-secret literal; exact value lives in the owner's pilot
    # procedure, not in this repo). Regenerate:
    #   testing-farm encrypt <vault-address> \
    #     --git-url https://github.com/RedHatInsights/insights-client | jq -r .
    VAULT_ADDR: "f59f9cfd-119c-40db-a0e5-c4e9ef277da5,"
    # AppRole role_id consumed by the guest-side loader (value lives in
    # Vault; never in this repo, even as a comment). Regenerate:
    #   ROLE_ID=$(vault kv get -format=json apps/cct-ci/approle/role-id \
    #     | jq -j .data.data.value)
    #   testing-farm encrypt "$ROLE_ID" \
    #     --git-url https://github.com/RedHatInsights/insights-client | jq -r .
    #   unset ROLE_ID
    VAULT_ROLE_ID: "f59f9cfd-119c-40db-a0e5-c4e9ef277da5,"
    # AppRole secret_id dedicated to this repo (value lives in Vault;
    # never in this repo, even as a comment). Regenerate:
    #   SECRET_ID=$(vault kv get -format=json apps/cct-ci/approle/secret-id-insights-client \
    #     | jq -j .data.data.value)
    #   testing-farm encrypt "$SECRET_ID" \
    #     --git-url https://github.com/RedHatInsights/insights-client | jq -r .
    #   unset SECRET_ID
    VAULT_SECRET_ID: "f59f9cfd-119c-40db-a0e5-c4e9ef277da5,"
