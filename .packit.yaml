upstream_package_name: insights-client
downstream_package_name: insights-client
specfile_path: out/insights-client.spec

srpm_build_deps:
  - gawk
  - rpkg

actions:
  post-upstream-clone:
    - mkdir out
    - rpkg srpm --outdir out
  get-current-version:
    - awk '/^Version:/ {print $2;}' out/insights-client.spec
  create-archive:
    - bash -c 'echo out/insights-client-*.tar.*'
  fix-spec-file:
    - echo 'nothing to fix'

jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      - rhel-10-x86_64
      - rhel-10-aarch64
      - rhel-10-s390x
      - rhel-10-ppc64le

  - job: copr_build
    trigger: commit
    branch: rhel-10-egg
    targets:
      - rhel-10-x86_64
      - rhel-10-aarch64
      - rhel-10-s390x
      - rhel-10-ppc64le

  - job: tests
    trigger: pull_request
    identifier: "unit/rhel"
    targets:
      rhel-10-x86_64:
        distros:
          - RHEL-10.0-Nightly
    labels:
      - unit
    tf_extra_params:
      environments:
        - settings:
            provisioning:
              tags:
                BusinessUnit: sst_csi_client_tools
          # Non-secret OS trust bundle (contains the Red Hat Internal
          # Root CA): lets the guest complete the TLS handshake with
          # Vault on Packit-submitted runs, which do not pass through
          # the Jenkins pipelines that export it pipeline-side.
          variables:
            REQUESTS_CA_BUNDLE: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    use_internal_tf: true
